# Alembic configuration for ProdIntel AI.
#
# The database URL is resolved at runtime by alembic/env.py, which prefers the
# DATABASE_URL environment variable and falls back to sqlalchemy.url below. This
# keeps production credentials out of the repo while allowing a local default.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Local fallback only; production sets DATABASE_URL (e.g. postgresql+psycopg://...).
sqlalchemy.url = sqlite+pysqlite:///./prodintel.db


# ----------------------------------------------------------------------------- #
# Logging
# ----------------------------------------------------------------------------- #
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
