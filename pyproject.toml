[project]
name = "prodintel-ai"
version = "0.1.0"
description = "ProdIntel AI -- AI Product Decision Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3.0",
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
vector = [
    "chromadb",
    "sentence-transformers",
]

[tool.pytest.ini_options]
# Run from the repo root so `import app...` resolves without installation.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
